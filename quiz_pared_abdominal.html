<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 Quiz — Parede Abdominal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #080808;
    --dark: #101010;
    --card: #141414;
    --card2: #181818;
    --border: #252525;
    --pink: #ff3d8a;
    --pink-light: #ff7ab0;
    --pink-pale: #ff3d8a14;
    --pink-glow: #ff3d8a30;
    --pink-deep: #c4005f;
    --white: #f4eef2;
    --muted: #777;
    --green: #3dff9a;
    --green-pale: #3dff9a15;
    --red: #ff4d6a;
    --red-pale: #ff4d6a15;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle dot grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, #ff3d8a08 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* ─── SPLASH SCREEN ─── */
  #splash {
    position: fixed;
    inset: 0;
    background: var(--black);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 18px;
    padding: 32px;
    text-align: center;
    transition: opacity 0.6s, transform 0.6s;
  }

  #splash.hide {
    opacity: 0;
    transform: scale(0.95);
    pointer-events: none;
  }

  .splash-badge {
    font-size: 3rem;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .splash-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .splash-title span { color: var(--pink); font-style: italic; }

  .splash-sub {
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    max-width: 360px;
  }

  .splash-info {
    display: flex;
    gap: 24px;
    margin: 8px 0;
  }

  .info-chip {
    background: var(--pink-pale);
    border: 1px solid var(--pink-glow);
    border-radius: 99px;
    padding: 6px 18px;
    font-size: 0.82rem;
    color: var(--pink-light);
    letter-spacing: 0.05em;
  }

  .btn-start {
    background: var(--pink);
    color: #fff;
    border: none;
    padding: 16px 48px;
    border-radius: 99px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 10px;
    box-shadow: 0 0 40px var(--pink-glow);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 60px var(--pink);
  }

  /* ─── MAIN QUIZ ─── */
  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .topbar::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 80px;
    height: 2px;
    background: var(--pink);
    box-shadow: 0 0 12px var(--pink);
  }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--pink-light);
    font-style: italic;
  }

  .score-pill {
    background: var(--pink-pale);
    border: 1px solid var(--pink-glow);
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 0.82rem;
    color: var(--pink-light);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* PROGRESS */
  .progress-wrap {
    margin-bottom: 32px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink-deep), var(--pink));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 12px var(--pink);
  }

  /* SECTION LABEL */
  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--pink-pale);
    border: 1px solid var(--pink-glow);
    border-radius: 99px;
    padding: 5px 14px;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--pink-light);
    font-weight: 500;
    margin-bottom: 20px;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 36px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  .q-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--pink-deep), var(--pink), transparent);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Clinical case banner */
  .clinical-banner {
    background: linear-gradient(135deg, #1a0010, #0f0016);
    border: 1px solid #3d0025;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    color: #d4a0be;
    line-height: 1.75;
    position: relative;
  }

  .clinical-banner::before {
    content: '🩺 CASO CLÍNICO';
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    color: var(--pink);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .q-number {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 1.05rem;
    color: var(--white);
    line-height: 1.7;
    font-weight: 400;
    margin-bottom: 28px;
  }

  /* OPTIONS */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    cursor: pointer;
    font-size: 0.92rem;
    color: #c0b0bc;
    line-height: 1.5;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
  }

  .option:hover:not(.disabled) {
    border-color: var(--pink-glow);
    background: var(--pink-pale);
    color: var(--white);
    transform: translateX(4px);
  }

  .option-letter {
    min-width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }

  .option.correct {
    border-color: var(--green);
    background: var(--green-pale);
    color: #b0ffdc;
  }

  .option.correct .option-letter {
    background: var(--green);
    color: #000;
  }

  .option.wrong {
    border-color: var(--red);
    background: var(--red-pale);
    color: #ffb0bb;
  }

  .option.wrong .option-letter {
    background: var(--red);
    color: #fff;
  }

  .option.disabled { cursor: default; }

  /* FEEDBACK */
  .feedback {
    margin-top: 18px;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.7;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .feedback.show { display: block; }

  .feedback.correct-fb {
    background: var(--green-pale);
    border: 1px solid #3dff9a30;
    color: #90e8c0;
  }

  .feedback.wrong-fb {
    background: var(--red-pale);
    border: 1px solid #ff4d6a30;
    color: #f0a0b0;
  }

  .feedback strong { color: var(--white); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* NEXT BUTTON */
  .btn-next {
    width: 100%;
    background: var(--pink);
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 16px;
    display: none;
    box-shadow: 0 4px 24px var(--pink-glow);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-next.show { display: block; }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--pink); }

  /* ACTION BUTTONS ROW (voltar + resetar) */
  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .btn-action {
    flex: 1;
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--muted);
    padding: 12px 10px;
    border-radius: 12px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-action:hover:not(:disabled) {
    border-color: var(--pink-glow);
    color: var(--pink-light);
    background: var(--pink-pale);
    transform: translateY(-1px);
  }

  .btn-action:disabled {
    opacity: 0.25;
    cursor: not-allowed;
    transform: none;
  }

  /* ─── RESULT SCREEN ─── */
  #result {
    display: none;
    text-align: center;
    padding: 60px 24px;
    animation: fadeIn 0.5s ease;
  }

  #result.show { display: block; }

  .result-emoji { font-size: 4rem; margin-bottom: 16px; }

  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 700;
    margin-bottom: 10px;
  }

  .result-title span { color: var(--pink); font-style: italic; }

  .result-score-big {
    font-size: clamp(3rem, 10vw, 5rem);
    font-weight: 700;
    color: var(--pink);
    font-family: 'Playfair Display', serif;
    line-height: 1;
    margin: 20px 0;
    text-shadow: 0 0 40px var(--pink);
  }

  .result-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 32px;
  }

  .result-breakdown {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 24px 0 36px;
    flex-wrap: wrap;
  }

  .breakdown-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 28px;
    min-width: 140px;
  }

  .breakdown-chip .chip-val {
    font-size: 1.8rem;
    font-weight: 700;
    font-family: 'Playfair Display', serif;
    color: var(--pink-light);
  }

  .breakdown-chip .chip-label {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .result-message {
    font-size: 1rem;
    color: #b0a0ac;
    max-width: 440px;
    margin: 0 auto 36px;
    line-height: 1.7;
  }

  .btn-restart {
    background: transparent;
    color: var(--pink);
    border: 2px solid var(--pink);
    padding: 14px 42px;
    border-radius: 99px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-restart:hover {
    background: var(--pink);
    color: #fff;
    box-shadow: 0 0 30px var(--pink);
  }

  @media (max-width: 520px) {
    .q-card { padding: 24px 20px; }
    .splash-info { flex-direction: column; gap: 10px; align-items: center; }
  }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-badge">🌷</div>
  <div class="splash-title">Quiz <span>Parede Abdominal</span></div>
  <p class="splash-sub">🎀 Anatomia Humana II · Teste seus conhecimentos 🎀</p>
  <div class="splash-info">
    <span class="info-chip">🫧 10 Questões teóricas</span>
    <span class="info-chip">🪷 10 Casos clínicos</span>
  </div>
  <button class="btn-start" onclick="startQuiz()">Começar 🌷</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="topbar">
    <span class="logo-text">🎀 Parede Abdominal</span>
    <span class="score-pill" id="score-display">Pontos: 0</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="q-counter">Questão 1 de 20</span>
      <span id="q-type-label">Teórica</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:5%"></div>
    </div>
  </div>

  <div id="quiz-body"></div>
  <div id="result"></div>

</div>

<script>
const questions = [
  // ─── TEÓRICAS (1–10) ───
  {
    type: "teorica",
    q: "O abdômen está situado entre quais estruturas do tronco?",
    opts: ["Entre a cabeça e o tórax","Entre o tórax e a pelve","Entre a pelve e os membros inferiores","Entre o pescoço e o diafragma"],
    ans: 1,
    exp: "O abdômen é definido como a parte do tronco situada <strong>entre o tórax (superior) e a pelve (inferior)</strong>. Funciona como um receptáculo flexível que abriga a maioria dos órgãos digestivos e parte do sistema urogenital."
  },
  {
    type: "teorica",
    q: "O osso coxal é formado, em estado primitivo, pela união de quais três ossos?",
    opts: ["Sacro, cóccix e ílio","Ílio, ísquio e púbis","Fêmur, ílio e ísquio","Púbis, sacro e ísquio"],
    ans: 1,
    exp: "O osso coxal (da quadril) é formado primitivamente pela fusão de <strong>ílio, ísquio e púbis</strong>. No adulto, eles se fundem em um único osso que articula com o sacro, com o coxal contralateral na sínfise púbica e com o fêmur."
  },
  {
    type: "teorica",
    q: "Qual músculo tem suas fibras mais inferiores formando o músculo cremaster, responsável pela elevação do testículo?",
    opts: ["Músculo oblíquo externo","Músculo transverso do abdômen","Músculo oblíquo interno","Músculo reto do abdômen"],
    ans: 2,
    exp: "As fibras inferiores do <strong>músculo oblíquo interno</strong>, próximas à espinha ilíaca anterossuperior e ao ligamento inguinal, desprendem-se em direção ao testículo formando o <strong>músculo cremaster</strong>."
  },
  {
    type: "teorica",
    q: "A linha alba é formada pelo entrecruzamento das aponeuroses dos músculos anchos. Entre quais duas estruturas ela se estende verticalmente?",
    opts: ["Umbigo até o púbis","Processo xifoide até a sínfise púbica","10ª costela até o sacro","Crista ilíaca até o úmbigo"],
    ans: 1,
    exp: "A linha alba se estende do <strong>processo xifoide (acima) até a borda superior da sínfise púbica (abaixo)</strong>, no plano mediano entre os dois músculos retos. Seu entrecruzamento de fibras confere grande solidez à parede anterior."
  },
  {
    type: "teorica",
    q: "Abaixo da linha arqueada (de Douglas), qual estrutura forma sozinha a parede posterior da bainha do reto?",
    opts: ["Aponeurose do oblíquo externo","Tendão conjunto","Fáscia transversal","Peritônio parietal"],
    ans: 2,
    exp: "Abaixo da linha arqueada, as três aponeuroses (oblíquo externo, oblíquo interno e transverso) passam todas pela face <em>anterior</em> do reto. Assim, a parede posterior da bainha fica constituída apenas pela <strong>fáscia transversal</strong>."
  },
  {
    type: "teorica",
    q: "Qual é a direção das fibras do músculo oblíquo externo?",
    opts: ["De baixo para cima e de fora para dentro","Horizontalmente de fora para dentro","De cima para baixo e de fora para dentro","De cima para baixo e de dentro para fora"],
    ans: 2,
    exp: "As fibras do músculo oblíquo externo vão <strong>de cima para baixo e de fora para dentro</strong> — sentido oblíquo descendente."
  },
  {
    type: "teorica",
    q: "Qual estrutura divide a cavidade peritoneal em compartimentos supramesocólico e inframesocólico?",
    opts: ["Epíplon maior","Ligamento falciforme","Mesocólon transverso","Mesocólon sigmoide"],
    ans: 2,
    exp: "O <strong>mesocólon transverso</strong> é uma prega peritoneal que divide a cavidade peritoneal em dois andares: o <em>supramesocólico</em> (fígado, estômago, baço) e o <em>inframesocólico</em> (intestino delgado, cólon, pelve)."
  },
  {
    type: "teorica",
    q: "Qual é a diferença clínica fundamental entre a dor do peritônio parietal e a do peritônio visceral?",
    opts: [
      "A dor parietal é difusa e a visceral é aguda e focal",
      "A dor parietal é aguda e bem localizada; a visceral é surda, difusa e inespecífica",
      "Ambas são iguais em qualidade e localização",
      "A dor parietal é crônica e a visceral é aguda"
    ],
    ans: 1,
    exp: "O peritônio parietal recebe inervação somática (nervios intercostais) → <strong>dor aguda, focal e localizada</strong>. O peritônio visceral é inervado por fibras autonômicas → <strong>dor surda, difusa e mal localizada</strong>. Essa distinção é crucial no exame físico abdominal."
  },
  {
    type: "teorica",
    q: "No canal inguinal, qual estrutura forma a parede inferior?",
    opts: ["Tendão conjunto","Fáscia transversal","Ligamento inguinal (arcada crural)","Aponeurose do oblíquo interno"],
    ans: 2,
    exp: "A <strong>parede inferior do canal inguinal é formada pelo ligamento inguinal</strong> (arcada crural), que é a borda inferior dobrada para dentro da aponeurose do músculo oblíquo externo, estendendo-se da espinha ilíaca anterossuperior até o tubérculo do púbis."
  },
  {
    type: "teorica",
    q: "A transcavidade dos epíplons possui quatro porções em sequência. Qual é a ordem correta da entrada para o interior?",
    opts: [
      "Vestíbulo → Hiato de Winslow → Foramen Bursae Omentalis → Cavidade",
      "Hiato de Winslow → Vestíbulo → Foramen Bursae Omentalis → Cavidade",
      "Foramen Bursae Omentalis → Hiato de Winslow → Vestíbulo → Cavidade",
      "Cavidade → Foramen Bursae Omentalis → Vestíbulo → Hiato de Winslow"
    ],
    ans: 1,
    exp: "A ordem correta é: <strong>Hiato de Winslow → Vestíbulo → Foramen Bursae Omentalis → Cavidade propriamente dita</strong>. O hiato de Winslow é a entrada para essa &ldquo;segunda cavidade&rdquo; peritoneal, situada atrás do estômago."
  },

  // ─── CASOS CLÍNICOS (11–20) ───
  {
    type: "clinico",
    caso: "Um homem de 45 anos procura a emergência com dor em região inguinal direita, piora progressiva ao esforço e uma tumoração visível no escroto. O cirurgião explica que o defeito ocorreu por uma fraqueza na parede posterior do canal inguinal, medialmente aos vasos epigástricos inferiores.",
    q: "Que tipo de hérnia inguinal apresenta este paciente?",
    opts: ["Hérnia inguinal indireta (oblíqua externa)","Hérnia inguinal direta (oblíqua interna)","Hérnia femoral","Hérnia umbilical"],
    ans: 1,
    exp: "<strong>Hérnia inguinal direta</strong>: ocorre medialmente aos vasos epigástricos inferiores, através de um ponto de fraqueza na parede posterior do canal inguinal (triângulo de Hesselbach). Diferente da indireta, que passa pelo anel inguinal profundo, lateral aos vasos."
  },
  {
    type: "clinico",
    caso: "Paciente de 28 anos, primigesta no 3° trimestre, queixa-se de dor epigástrica e sensação de falta de ar que piora em decúbito dorsal. A ultrassonografia mostra deslocamento superior do diafragma e das vísceras abdominais.",
    q: "Qual é o principal mecanismo anatômico que explica a dispneia desta paciente?",
    opts: [
      "Compressão das veias pulmonares pelo útero aumentado",
      "Elevação do diafragma pelas vísceras abdominais comprimidas pelo útero em crescimento",
      "Fraqueza dos músculos intercostais por distensão da parede abdominal",

      "Cordão espermático e nervo ilioinguinal",

  }

let current = 0;
let score = 0;
let answered = false;
// tracks whether each question was answered correctly (true), wrong (false), or skipped (null)
let scoreHistory = [];

function shuffleOptions(q) {
  // Create indexed copy of opts, shuffle, then remap ans
  const indexed = q.opts.map((opt, i) => ({ opt, correct: i === q.ans }));
  for (let i = indexed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
  }
  q.opts = indexed.map(x => x.opt);
  q.ans  = indexed.findIndex(x => x.correct);
}

function startQuiz() {
  // Shuffle options for every question once at start
  questions.forEach(shuffleOptions);
  document.getElementById('splash').classList.add('hide');
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderQuestion();
  }, 600);
}

function renderQuestion() {
  if (current >= questions.length) {
    showResult();
    return;
  }

  answered = false;
  const q = questions[current];
  const container = document.getElementById('quiz-body');
  const letters = ['A','B','C','D'];

  // Update progress bar — smooth fill from ~5% to 100%
  const pct = Math.max(5, Math.round(((current) / questions.length) * 100));
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `Questão ${current + 1} de ${questions.length}`;
  document.getElementById('q-type-label').textContent = q.type === 'clinico' ? '🪷 Caso Clínico' : '🫧 Teórica';
  document.getElementById('score-display').textContent = `Pontos: ${score}`;

  // Ensure result is hidden and quiz-body is visible
  document.getElementById('result').classList.remove('show');
  container.style.display = 'block';

  const sectionLabel = q.type === 'clinico'
    ? `<div class="section-label">🪷 Caso Clínico — Nível Médio</div>`
    : `<div class="section-label">🫧 Questão Teórica</div>`;

  const optionsHTML = q.opts.map((opt, i) => `
    <button class="option" id="opt-${i}" onclick="selectOption(${i})">
      <span class="option-letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>
  `).join('');

  container.innerHTML = `
    ${sectionLabel}
    <div class="q-card">
      <div class="q-number">Questão ${current + 1}</div>
      ${q.type === 'clinico' ? `<div class="clinical-banner">${q.caso}</div>` : ''}
      <div class="q-text">${q.q}</div>
      <div class="options">${optionsHTML}</div>
      <div class="feedback" id="feedback"></div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">
      ${current + 1 < questions.length ? 'Próxima Questão 🌷' : 'Ver Resultado 🎀'}
    </button>
    <div class="action-row">
      <button class="btn-action" id="btn-back" onclick="goBack()" ${current === 0 ? 'disabled' : ''}>
        ← Voltar
      </button>
      <button class="btn-action" id="btn-reset-q" onclick="resetQuestion()">
        ↺ Refazer esta
      </button>
      <button class="btn-action" id="btn-reveal" onclick="revealAnswer()">
        💡 Ver resposta
      </button>
    </div>
  `;
}

function selectOption(idx) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const feedback = document.getElementById('feedback');
  const btnNext = document.getElementById('btn-next');

  // Disable all options
  q.opts.forEach((_, i) => {
    document.getElementById(`opt-${i}`).classList.add('disabled');
  });

  // Highlight correct answer always
  document.getElementById(`opt-${q.ans}`).classList.add('correct');

  if (idx === q.ans) {
    score++;
    scoreHistory[current] = true;
    feedback.className = 'feedback correct-fb show';
    feedback.innerHTML = `<strong>✅ Correto!</strong> ${q.exp}`;
  } else {
    document.getElementById(`opt-${idx}`).classList.add('wrong');
    scoreHistory[current] = false;
    feedback.className = 'feedback wrong-fb show';
    feedback.innerHTML = `<strong>❌ Incorreto.</strong> A resposta certa era a opção ${['A','B','C','D'][q.ans]}. ${q.exp}`;
  }

  btnNext.classList.add('show');
  document.getElementById('score-display').textContent = `Pontos: ${score}`;
}

function nextQuestion() {
  current++;
  renderQuestion();
}

function goBack() {
  if (current === 0) return;
  // If the current question was answered correctly, remove that point
  if (scoreHistory[current] === true) score--;
  // Clear history for current question (unanswered again)
  scoreHistory[current] = undefined;
  current--;
  // Undo the previous question's score too so it can be re-answered
  if (scoreHistory[current] === true) score--;
  scoreHistory[current] = undefined;
  renderQuestion();
}

function resetQuestion() {
  // Deduct score if this question was already answered correctly
  if (scoreHistory[current] === true) score--;
  scoreHistory[current] = undefined;
  renderQuestion();
}

function revealAnswer() {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const letters = ['A','B','C','D'];

  // Disable all options
  q.opts.forEach((_, i) => {
    document.getElementById(`opt-${i}`).classList.add('disabled');
  });

  // Highlight correct only, no score
  document.getElementById(`opt-${q.ans}`).classList.add('correct');
  scoreHistory[current] = false; // counts as wrong (didn't answer)

  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback wrong-fb show';
  feedback.innerHTML = `<strong>💡 Resposta revelada.</strong> A correta era a opção ${letters[q.ans]}. ${q.exp}`;

  document.getElementById('btn-next').classList.add('show');
  document.getElementById('score-display').textContent = `Pontos: ${score}`;
}

function showResult() {
  const container = document.getElementById('quiz-body');
  container.innerHTML = ''; // limpa o conteúdo (inclusive o btn-next interno)
  container.style.display = 'none';
  document.getElementById('progress-fill').style.width = '100%';

  const pct = Math.round((score / questions.length) * 100);
  let emoji, title, msg;

  if (pct >= 90) {
    emoji = '👑'; title = 'Excelente!'; msg = 'Você domina a anatomia da parede abdominal! Está pronta para a prova. 🎀';
  } else if (pct >= 70) {
    emoji = '🌷'; title = 'Muito bem!'; msg = 'Ótimo desempenho! Revise os pontos que errou e você estará perfeita. 🪷';
  } else if (pct >= 50) {
    emoji = '🫧'; title = 'Continue estudando'; msg = 'Você está no caminho certo! Revise o resumo e tente novamente. 💐';
  } else {
    emoji = '📖'; title = 'Hora de revisar'; msg = 'Não desanime! Releia o resumo da parede abdominal com atenção e refaça o quiz. 🌷';
  }

  // Separate score for teoricas vs clinicas
  let acertosTeoricas = 0;
  let acertosClinicas = 0;
  // We track per-question results via score only (no per-question history stored),
  // so we show total acertos, erros, pct
  const resultEl = document.getElementById('result');
  resultEl.innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <div class="result-title">${title} <span>🎀</span></div>
    <div class="result-score-big">${score}<span style="font-size:0.45em; color: var(--muted);">/${questions.length}</span></div>
    <div class="result-sub">${pct}% de aproveitamento</div>
    <div class="result-breakdown">
      <div class="breakdown-chip">
        <div class="chip-val">${score}</div>
        <div class="chip-label">🌷 Acertos</div>
      </div>
      <div class="breakdown-chip">
        <div class="chip-val">${questions.length - score}</div>
        <div class="chip-label">🫧 Erros</div>
      </div>
      <div class="breakdown-chip">
        <div class="chip-val">${pct}%</div>
        <div class="chip-label">🪷 Score</div>
      </div>
    </div>
    <div class="result-message">${msg}</div>
    <button class="btn-restart" onclick="restartQuiz()">Refazer Quiz 🌷</button>
    <div style="margin-top: 36px; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;">By: Nayaro 🎀</div>
  `;
  resultEl.classList.add('show');
}

function restartQuiz() {
  current = 0;
  score = 0;
  answered = false;
  scoreHistory = [];
  // Re-shuffle so options come out in different order
  questions.forEach(shuffleOptions);
  document.getElementById('result').classList.remove('show');
  document.getElementById('quiz-body').style.display = 'block';
  document.getElementById('progress-fill').style.width = '5%';
  renderQuestion();
}
</script>
